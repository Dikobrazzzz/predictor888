stages:
  - build
  - deploy

include:
  - project: infrastructure/ci-cd
    ref: main
    file:
      - templates/docker-build/multi-images-build.yaml
  - project: infrastructure/prod-deploy
    ref: main
    file:
      - .gitlab-ci/deploy-template.yml
  - project: infrastructure/helm-charts
    ref: main
    file:
      - .gitlab-ci/deploy-dev-k8s.yml

# api- и web-образы собирает шаблон infrastructure/ci-cd (.docker-build-base) →
# теги main-<ts>-<sha>, которые ловит Flux ImagePolicy; EXPECTED_*_IMAGE идут в прод-деплой.
docker-build-api:
  extends: .docker-build-base
  variables:
    DOCKERFILE_PATH: "api/Dockerfile"
    BUILD_CONTEXT: "api"
  script:
    - |
      docker buildx build --push --provenance=false \
        -t "${CI_REGISTRY_IMAGE}:${TAG}" \
        -f "${DOCKERFILE_PATH}" \
        ${BUILD_ARGS} \
        "${BUILD_CONTEXT}"
      echo "BUILT_TAG=${TAG}" >> build.env
      echo "EXPECTED_BACKEND_IMAGE=${CI_REGISTRY_IMAGE}:${TAG}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - api/Dockerfile

docker-build-web:
  extends: .docker-build-base
  variables:
    IMAGE_SUFFIX: "/web"
    DOCKERFILE_PATH: "web/Dockerfile"
    BUILD_CONTEXT: "."
  script:
    - |
      docker buildx build --push --provenance=false \
        -t "${CI_REGISTRY_IMAGE}/web:${TAG}" \
        -f "${DOCKERFILE_PATH}" \
        ${BUILD_ARGS} \
        "${BUILD_CONTEXT}"
      echo "BUILT_WEB_TAG=${TAG}" >> ui-build.env
      echo "EXPECTED_UI_IMAGE=${CI_REGISTRY_IMAGE}/web:${TAG}" >> ui-build.env
  artifacts:
    reports:
      dotenv: ui-build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - web/Dockerfile

deploy-prod:
  extends: .deploy-prod
  tags:
    - prod-deploy
  needs:
    - docker-build-api
    - docker-build-web
    #- job: indicate-k8s-dev
    #  optional: true
  variables:
    DEPLOY_PATH: "/opt/gamification-prod"
    COMPOSE_TEMPLATE: ".cicd/prod/docker-compose.yml.j2"
    FILES_DIR: ".cicd/prod/files"
    VAULT_SECRET_PATH: "pve-prod/marketing/gamification"
    EXTRA_TASKS_PATH: ".cicd/prod/extra-tasks.yml"
    ANSIBLE_EXTRA_ARGS: >-
      -e docker_image=$EXPECTED_BACKEND_IMAGE
      -e web_image=$EXPECTED_UI_IMAGE
      -e migrations_src_dir=$CI_PROJECT_DIR/api/migrations
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

sync-flux-env-to-helm-charts:
  stage: deploy
  image: alpine:3.20
  resource_group: helm-charts-gamification-env-sync
  variables:
    HELM_CHARTS_PROJECT_PATH: infrastructure/helm-charts
    HELM_CHARTS_ENV_FILE: flux/eks-dev/marketing/gamification-api-env/env.yaml
    HELM_CHARTS_GIT_USERNAME: oauth2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - .cicd/deploy/common.yaml
        - .cicd/deploy/dev.yaml
  before_script:
    - apk add --no-cache git curl ca-certificates yq-go
  script:
    - |
      set -euo pipefail
      test -n "${HELM_CHARTS_PUSH_TOKEN:-}" || { echo "ERROR: HELM_CHARTS_PUSH_TOKEN"; exit 1; }
      HC_HOST="${HELM_CHARTS_GIT_HOST:-$CI_SERVER_HOST}"
      CLONE_URL="https://${HELM_CHARTS_GIT_USERNAME:-oauth2}:${HELM_CHARTS_PUSH_TOKEN}@${HC_HOST}/${HELM_CHARTS_PROJECT_PATH}.git"
      yq eval-all '. as $item ireduce ({}; . * $item)' .cicd/deploy/common.yaml .cicd/deploy/dev.yaml > gamification-env.generated.yaml
      git clone --depth 1 --branch main "${CLONE_URL}" /tmp/helm-charts
      install -D -m 0644 gamification-env.generated.yaml "/tmp/helm-charts/${HELM_CHARTS_ENV_FILE}"
      cd /tmp/helm-charts && git config user.email "gitlab-ci-bot@luckytits.org" && git config user.name "gitlab-ci-bot"
      git add "${HELM_CHARTS_ENV_FILE}" && git diff --staged --quiet && exit 0
      git commit -m "chore(gamification): sync eks-dev env [skip ci]" && git push origin HEAD:main

indicate-k8s-dev:
  extends: .indicate-k8s-dev
  needs:
    - job: docker-build-api
      optional: true
    - job: docker-build-web
      optional: true
    - job: sync-flux-env-to-helm-charts
      optional: true
  resource_group: "${CI_PROJECT_NAME}-dev-image-tags"
  variables:
    K8S_NAMESPACE: marketing
    BACKEND_DEPLOYMENT: gamification-api-app
    UI_DEPLOYMENT: gamification-ui-app
    SMOKE_CHECK_URL: "https://gamification.dev.luckytits.org/"
    ENVIRONMENT_NAME: "dev/gamification"
    ENVIRONMENT_URL: "https://gamification.dev.luckytits.org"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
