stages:
  - build
  - deploy

include:
  - project: infrastructure/prod-deploy
    ref: main
    file:
      - .gitlab-ci/deploy-template.yml
  - project: infrastructure/helm-charts
    ref: main
    file:
      - .gitlab-ci/deploy-dev-k8s.yml

.build_backend_template: &build_backend_template
  image: docker:cli
  stage: build
  services:
    - name: docker:dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_DRIVER: overlay2
      command: ["--insecure-registry=gitlab.luckytits.org:5050", "--log-level=warn"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
    BUILDKIT_PROGRESS: auto
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHORT_SHA
    DOCKER_CONFIG: /tmp/docker
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - echo "Docker daemon is ready"
    - mkdir -p $DOCKER_CONFIG
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Building api image..."
    - docker build --pull -t "$DOCKER_IMAGE_NAME" api
    - echo "Pushing image to registry..."
    - docker push --quiet "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        echo "Tagging and pushing as latest..."
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:latest"
        docker push --quiet "$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:latest"
      fi
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:${CI_COMMIT_REF_SLUG}"
        docker push --quiet "$CI_REGISTRY_IMAGE:${CI_COMMIT_REF_SLUG}"
      fi

.build_frontend_template: &build_frontend_template
  image: docker:cli
  stage: build
  services:
    - name: docker:dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_DRIVER: overlay2
      command: ["--insecure-registry=gitlab.luckytits.org:5050", "--log-level=warn"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
    BUILDKIT_PROGRESS: auto
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/web/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHORT_SHA
    DOCKER_CONFIG: /tmp/docker
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - echo "Docker daemon is ready"
    - mkdir -p $DOCKER_CONFIG
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Building web image..."
    - docker build --pull -f web/Dockerfile -t "$DOCKER_IMAGE_NAME" .
    - echo "Pushing image to registry..."
    - docker push --quiet "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        echo "Tagging and pushing as latest..."
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE/web/$CI_COMMIT_REF_SLUG:latest"
        docker push --quiet "$CI_REGISTRY_IMAGE/web/$CI_COMMIT_REF_SLUG:latest"
      fi
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE/web:${CI_COMMIT_REF_SLUG}"
        docker push --quiet "$CI_REGISTRY_IMAGE/web:${CI_COMMIT_REF_SLUG}"
      fi

build_production:
  extends: .build_backend_template
  after_script:
    - |
      _DIGEST=$(docker image inspect --format='{{index .RepoDigests 0}}' "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}" 2>/dev/null | cut -d@ -f2 || true)
      if [ -n "${_DIGEST}" ]; then
        echo "EXPECTED_BACKEND_IMAGE=${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}@${_DIGEST}" >> "${CI_PROJECT_DIR}/build.env"
      fi
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - api/Dockerfile
    - when: never


build_web_production:
  extends: .build_frontend_template
  after_script:
    - |
      _DIGEST=$(docker image inspect --format='{{index .RepoDigests 0}}' "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_REF_SLUG}" 2>/dev/null | cut -d@ -f2 || true)
      if [ -n "${_DIGEST}" ]; then
        echo "EXPECTED_UI_IMAGE=${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_REF_SLUG}@${_DIGEST}" >> "${CI_PROJECT_DIR}/ui-build.env"
      fi
  artifacts:
    reports:
      dotenv: ui-build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - web/Dockerfile
    - when: never

deploy-prod:
  extends: .deploy-prod
  tags:
    - prod-deploy
  needs:
    - build_production
    - build_web_production
    - job: indicate-k8s-dev
      optional: true
  variables:
    DEPLOY_PATH: "/opt/gamification-prod"
    VAULT_SECRET_PATH: "pve-prod/marketing/gamification"
    EXTRA_TASKS_PATH: ".cicd/prod/extra-tasks.yml"
    ANSIBLE_EXTRA_ARGS: >-
      -e docker_image=$CI_REGISTRY_IMAGE/main:latest
      -e web_image=$CI_REGISTRY_IMAGE/web/main:latest
      -e migrations_src_dir=$CI_PROJECT_DIR/api/migrations
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

sync-flux-env-to-helm-charts:
  stage: deploy
  image: alpine:3.20
  resource_group: helm-charts-gamification-env-sync
  variables:
    HELM_CHARTS_PROJECT_PATH: infrastructure/helm-charts
    HELM_CHARTS_ENV_FILE: flux/eks-dev/marketing/gamification-api-env/env.yaml
    HELM_CHARTS_GIT_USERNAME: oauth2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - .cicd/deploy/common.yaml
        - .cicd/deploy/dev.yaml
  before_script:
    - apk add --no-cache git curl ca-certificates yq-go
  script:
    - |
      set -euo pipefail
      test -n "${HELM_CHARTS_PUSH_TOKEN:-}" || { echo "ERROR: HELM_CHARTS_PUSH_TOKEN"; exit 1; }
      HC_HOST="${HELM_CHARTS_GIT_HOST:-$CI_SERVER_HOST}"
      CLONE_URL="https://${HELM_CHARTS_GIT_USERNAME:-oauth2}:${HELM_CHARTS_PUSH_TOKEN}@${HC_HOST}/${HELM_CHARTS_PROJECT_PATH}.git"
      yq eval-all '. as $item ireduce ({}; . * $item)' .cicd/deploy/common.yaml .cicd/deploy/dev.yaml > gamification-env.generated.yaml
      git clone --depth 1 --branch main "${CLONE_URL}" /tmp/helm-charts
      install -D -m 0644 gamification-env.generated.yaml "/tmp/helm-charts/${HELM_CHARTS_ENV_FILE}"
      cd /tmp/helm-charts && git config user.email "gitlab-ci-bot@luckytits.org" && git config user.name "gitlab-ci-bot"
      git add "${HELM_CHARTS_ENV_FILE}" && git diff --staged --quiet && exit 0
      git commit -m "chore(gamification): sync eks-dev env [skip ci]" && git push origin HEAD:main

indicate-k8s-dev:
  extends: .indicate-k8s-dev
  needs:
    - build_production
    - build_web_production
    - job: sync-flux-env-to-helm-charts
      optional: true
  resource_group: "${CI_PROJECT_NAME}-dev-image-tags"
  variables:
    K8S_NAMESPACE: marketing
    BACKEND_DEPLOYMENT: gamification-api-app
    UI_DEPLOYMENT: gamification-ui-app
    SMOKE_CHECK_URL: "https://gamification.dev.luckytits.org/"
    ENVIRONMENT_NAME: "dev/gamification"
    ENVIRONMENT_URL: "https://gamification.dev.luckytits.org"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
