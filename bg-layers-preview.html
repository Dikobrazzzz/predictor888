<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Telegram BG layers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; font-family: system-ui, sans-serif; color: #fff; padding: 24px; }
    .title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { text-align: center; font-size: 13px; color: #555; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1100px; margin: 0 auto; }
    .card { background: #181818; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a2a; }
    .card-label { padding: 10px 14px; font-size: 12px; color: #888; border-bottom: 1px solid #2a2a2a; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .layer-num { font-size: 13px; font-weight: 700; color: #fff; }
    .badge { background: #2a2a2a; border-radius: 6px; padding: 2px 7px; font-size: 11px; color: #aaa; font-family: monospace; }
    .preview { height: 340px; position: relative; background: #131313; }
    .preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .final .preview img:nth-child(1) { mix-blend-mode: overlay; }
  </style>
</head>
<body>
  <p class="title">Telegram page — фоновые слои</p>
  <p class="subtitle">Слои накладываются снизу вверх</p>
  <div class="grid">

    <div class="card">
      <div class="card-label">
        <span class="layer-num">Слой 1</span>
        <span class="badge">Vector-3.svg</span>
        <span class="badge">mix-blend-mode: overlay</span>
      </div>
      <div class="preview">
        <img src="/icons/Vector-3.svg">
      </div>
    </div>

    <div class="card">
      <div class="card-label">
        <span class="layer-num">Слой 2</span>
        <span class="badge">BG-3.svg</span>
      </div>
      <div class="preview">
        <img src="/icons/BG-3.svg">
      </div>
    </div>

    <div class="card">
      <div class="card-label">
        <span class="layer-num">Слой 3</span>
        <span class="badge">red light-2.svg</span>
      </div>
      <div class="preview">
        <img src="/icons/red light-2.svg">
      </div>
    </div>

    <div class="card final">
      <div class="card-label">
        <span class="layer-num">Итог</span>
        <span class="badge">все 3 слоя</span>
      </div>
      <div class="preview">
        <img src="/icons/Vector-3.svg">
        <img src="/icons/BG-3.svg">
        <img src="/icons/red light-2.svg">
      </div>
    </div>

  </div>
</body>
</html>
