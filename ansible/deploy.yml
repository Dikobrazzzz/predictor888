---
- name: Deploy gamification
  hosts: all
  vars:
    CI_REGISTRY: "{{ lookup('ansible.builtin.env','CI_REGISTRY') }}"
    CI_JOB_TOKEN: "{{ lookup('ansible.builtin.env','CI_JOB_TOKEN') }}"
    CI_REGISTRY_IMAGE: "{{ lookup('ansible.builtin.env','CI_REGISTRY_IMAGE') }}"
    CI_COMMIT_SHORT_SHA: "{{ lookup('ansible.builtin.env','CI_COMMIT_SHORT_SHA') }}"

    SERVER_USER: "{{ lookup('ansible.builtin.env','SERVER_USER') }}"
    SERVER_PROJECT_PATH: "{{ lookup('ansible.builtin.env','SERVER_PROJECT_PATH') }}"
    REPO_BRANCH: "{{ lookup('ansible.builtin.env','REPO_BRANCH') }}"

    POSTGRES_USER: "{{ lookup('ansible.builtin.env','POSTGRES_USER') | default('predictor', true) }}"
    POSTGRES_PASSWORD: "{{ lookup('ansible.builtin.env','POSTGRES_PASSWORD') }}"
    POSTGRES_DB: "{{ lookup('ansible.builtin.env','POSTGRES_DB') | default('predictor888', true) }}"
    DB_PORT: "{{ lookup('ansible.builtin.env','DB_PORT') | default('5432', true) }}"

    CF_WORKER_URL: "{{ lookup('ansible.builtin.env','CF_WORKER_URL') | default('', true) }}"
    API_PORT: "{{ lookup('ansible.builtin.env','API_PORT') | default('8082', true) }}"
    GOMAXPROCS: "{{ lookup('ansible.builtin.env','GOMAXPROCS') | default('4', true) }}"
    NGINX_SERVER_NAME: "{{ lookup('ansible.builtin.env','NGINX_SERVER_NAME') | default('_', true) }}"
    CERT_DOMAIN: "{{ lookup('ansible.builtin.env','CERT_DOMAIN') }}"
    AWS_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env','AWS_ACCESS_KEY_ID') }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env','AWS_SECRET_ACCESS_KEY') }}"

    deploy_path: "/home/{{ SERVER_USER }}/{{ SERVER_PROJECT_PATH }}/"
    nginx_config_path: "/home/{{ SERVER_USER }}/nginx/"

  tasks:
    - name: Validate required variables
      assert:
        that:
          - CI_REGISTRY_IMAGE | length > 0
          - CI_COMMIT_SHORT_SHA | length > 0
          - REPO_BRANCH | length > 0
          - SERVER_USER | length > 0
          - SERVER_PROJECT_PATH | length > 0
          - POSTGRES_PASSWORD | length > 0
          - CERT_DOMAIN | length > 0
          - AWS_ACCESS_KEY_ID | length > 0
          - AWS_SECRET_ACCESS_KEY | length > 0
        fail_msg: "Missing required environment variables for deploy"

    - name: Create deployment directory
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'
        owner: "{{ SERVER_USER }}"
        group: "{{ SERVER_USER }}"
      

    - name: Clean up deployment directory (keep certs)
      shell: |
        echo 'Cleaning up directory (keeping certs)...'
        rm -rf .git || true
      args:
        chdir: "{{ deploy_path }}"
      failed_when: false
      changed_when: false

    - name: Ensure nginx directory exists
      file:
        path: "{{ nginx_config_path }}"
        state: directory
        mode: '0755'
        owner: "{{ SERVER_USER }}"
        group: "{{ SERVER_USER }}"
      

    - name: Ensure certs directory exists
      file:
        path: "{{ nginx_config_path }}/certs"
        state: directory
        mode: '0755'
        owner: "{{ SERVER_USER }}"
        group: "{{ SERVER_USER }}"
      

    - name: Ensure conf.d directory exists
      file:
        path: "{{ nginx_config_path }}/conf.d"
        state: directory
        mode: '0755'
        owner: "{{ SERVER_USER }}"
        group: "{{ SERVER_USER }}"
      

    - name: Check nginx container status
      community.docker.docker_container_info:
        name: "nginx-dev"
      register: nginx_container_info
      failed_when: false

    - name: Determine if nginx needs start
      set_fact:
        nginx_needs_start: >-
          {{
            (nginx_container_info.container is not defined)
            or (nginx_container_info.container is none)
            or ((nginx_container_info.container.State.Status | default('')) != 'running')
          }}

    - name: Ensure backup directory exists
      file:
        path: "{{ deploy_path }}/backup"
        state: directory
        mode: '0755'
        owner: "{{ SERVER_USER }}"
        group: "{{ SERVER_USER }}"
      

    - name: Install backup script
      template:
        src: backup.sh.j2
        dest: "{{ deploy_path }}/backup/backup.sh"
        mode: '0755'

    - name: Login to docker registry
      shell: |
        echo "{{ CI_JOB_TOKEN }}" | docker login {{ CI_REGISTRY }} -u gitlab-ci-token --password-stdin

    - name: Generate docker-compose.yml from template
      template:
        src: docker-compose.yml.j2
        dest: "{{ deploy_path }}/docker-compose.yml"
        mode: '0644'

    - name: Generate nginx.conf from template
      template:
        src: nginx.conf.j2
        dest: "{{ nginx_config_path }}/conf.d/gamification.conf"
        mode: '0644'

    - name: Ensure nginx network exists
      community.docker.docker_network:
        name: nginx_net
        state: present
      when: nginx_needs_start

    - name: Install nginx docker-compose.yml
      copy:
        dest: "{{ nginx_config_path }}/docker-compose.yml"
        mode: '0644'
        content: |
          services:
            nginx:
              image: nginx:alpine
              container_name: nginx-dev
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./conf.d:/etc/nginx/conf.d:ro
                - ./certs:/etc/nginx/certs:ro
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost/"]
                interval: 10s
                timeout: 3s
                retries: 10
              extra_hosts:
                - "host.docker.internal:host-gateway"
              networks: [nginx_net]

          networks:
            nginx_net:
              external: true
      when: nginx_needs_start

    - name: Stop and remove existing containers
      shell: |
        cd "{{ deploy_path }}"
        docker compose down || true
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Pull latest images
      shell: |
        cd "{{ deploy_path }}"
        docker compose pull
      args:
        executable: /bin/bash

    - name: Start containers with docker-compose
      shell: |
        cd "{{ deploy_path }}"
        docker compose up -d
      args:
        executable: /bin/bash

    - name: Run cert script from template without saving to disk
      no_log: true
      ansible.builtin.shell: |
        set -euo pipefail
        {{ lookup('template', 'cert-gamification.sh.j2') | indent(4) }}
      args:
        executable: /bin/bash

    - name: Stop nginx container with docker compose
      shell: |
        cd "{{ nginx_config_path }}"
        docker compose down
      args:
        executable: /bin/bash

    - name: Start nginx container with docker compose
      shell: |
        cd "{{ nginx_config_path }}"
        docker compose up -d
      args:
        executable: /bin/bash

    - name: Wait 20 seconds for containers to initialize
      pause:
        seconds: 20

    - name: Check if containers are running
      shell: |
        cd "{{ deploy_path }}"
        docker compose ps
      args:
        executable: /bin/bash
      register: containers_status

    - name: Show containers status
      debug:
        msg: "{{ containers_status.stdout_lines }}"

    - name: Show logs for docker compose containers (last 50 lines)
      shell: |
        cd "{{ deploy_path }}"
        docker compose logs --tail=50
      args:
        executable: /bin/bash
      register: app_logs
      ignore_errors: yes

    - name: Display app logs
      debug:
        msg: "{{ app_logs.stdout_lines }}"
