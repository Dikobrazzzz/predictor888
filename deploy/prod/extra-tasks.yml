---
- name: Ensure migrations directory exists
  file:
    path: "{{ deploy_path }}/migrations"
    state: directory
    mode: "0755"

- name: Copy migrations to server
  copy:
    src: "{{ migrations_src_dir }}/"
    dest: "{{ deploy_path }}/migrations/"
    mode: "0644"
    directory_mode: "0755"

- name: Ensure backup script is executable
  file:
    path: "{{ deploy_path }}/backup/backup.sh"
    mode: "0755"

- name: Start database container
  become: yes
  shell: |
    cd "{{ deploy_path }}"
    docker compose up -d db
  args:
    executable: /bin/bash

- name: Wait for database to be healthy
  become: yes
  shell: |
    cd "{{ deploy_path }}"
    for i in $(seq 1 30); do
      docker compose exec -T db pg_isready -U {{ postgres_user }} -d {{ postgres_db }} && break
      sleep 2
    done
  args:
    executable: /bin/bash

- name: Run database migrations
  become: yes
  shell: |
    cd "{{ deploy_path }}"
    for f in migrations/*.sql; do
      echo "Applying $f..."
      docker compose exec -T db psql -v ON_ERROR_STOP=0 \
        -U {{ postgres_user }} -d {{ postgres_db }} \
        -f "/migrations/$(basename $f)" || true
    done
  args:
    executable: /bin/bash

- name: Ensure nginx directories exist
  vars:
    nginx_base_dir: "/opt/nginx-marketing"
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ nginx_base_dir }}"
    - "{{ nginx_base_dir }}/conf.d"

- name: Check nginx container status
  become: yes
  community.docker.docker_container_info:
    name: "nginx-marketing"
  register: nginx_container_info
  failed_when: false

- name: Determine if nginx needs start
  become: yes
  set_fact:
    nginx_needs_start: >-
      {{
        (nginx_container_info.container is not defined)
        or (nginx_container_info.container is none)
        or ((nginx_container_info.container.State.Status | default('')) != 'running')
      }}

- name: Render nginx.conf to nginx conf.d
  template:
    src: "{{ files_dir }}/nginx.conf.j2"
    dest: "/opt/nginx-marketing/conf.d/gamification.conf"
    mode: "0644"

- name: Ensure nginx network exists
  become: yes
  community.docker.docker_network:
    name: nginx_net
    state: present
  when: nginx_needs_start

- name: Install nginx docker-compose.yml
  become: yes
  vars:
    nginx_base_dir: "/opt/nginx-marketing"
  copy:
    dest: "{{ nginx_base_dir }}/docker-compose.yml"
    mode: "0644"
    content: |
      services:
        nginx:
          image: nginx:alpine
          container_name: nginx-marketing
          ports:
            - "80:80"
          volumes:
            - ./conf.d:/etc/nginx/conf.d:ro
          restart: unless-stopped
          healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost/"]
            interval: 10s
            timeout: 3s
            retries: 10
          networks: [nginx_net]

      networks:
        nginx_net:
          external: true
  when: nginx_needs_start

- name: Stop nginx container with docker compose
  become: yes
  vars:
    nginx_base_dir: "/opt/nginx-marketing"
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_base_dir }}"
    state: absent
  ignore_errors: yes

- name: Start nginx container with docker compose
  become: yes
  vars:
    nginx_base_dir: "/opt/nginx-marketing"
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_base_dir }}"
    state: present
    pull: always
    recreate: always
